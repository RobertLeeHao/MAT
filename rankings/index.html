/* ═══ Rankings page · 2026-10-14. Uses the site's tokens and grid (copied above from index.html). ═══ */
html,body{--ground:#1A1726}
.lg-sprite{position:absolute;width:0;height:0;overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.ic{display:inline-block;flex:none;width:calc(16*var(--px));height:calc(16*var(--px))}
.ic.s{width:calc(12*var(--px));height:calc(12*var(--px))}
.blogo{color:var(--paper)}
main{padding-top:var(--navh)}
.nav .logo svg{width:calc(26*var(--px));height:calc(16*var(--px))}
.links a.cur{color:var(--paper)}
.lang-pop{position:absolute;right:var(--m);top:calc(var(--navh) - 4*var(--px));z-index:50;background:var(--pop);box-shadow:inset 0 0 0 .5px var(--hc2);padding:var(--s2) 0;min-width:calc(160*var(--px))}
.lang-pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:var(--s2) var(--s4);font:500 calc(13*var(--px))/1.4 var(--text);color:var(--mute);cursor:pointer}
.lang-pop button:hover,.lang-pop button[aria-current="true"]{color:var(--paper)}
.lang-pop p{padding:var(--s2) var(--s4) 0;font-size:calc(11*var(--px));color:var(--dim);max-width:24ch}

section{padding-bottom:var(--s10)}
.sec-lab{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:var(--s4);align-items:baseline;padding:var(--s3) 0 var(--s6);border-top:.5px solid var(--hc2);font-size:var(--small);font-weight:500;color:var(--mute)}
.sec-lab b{color:var(--paper);font-weight:600}
.sec-lab .r{margin-left:auto;display:flex;gap:var(--s5);align-items:center}

/* header */
#top{padding-top:var(--s9)}
#top .lab{grid-column:1/-1}
#top .lab a{display:flex;gap:var(--s3);color:var(--mute)}
#top .lab a:hover{color:var(--paper)}
#top .lab em{margin-left:auto;font-style:normal;font-size:calc(11*var(--px));color:var(--dim)}
#top h1{grid-column:1/10;margin-top:var(--s10);font-size:var(--d2)}
#top .lede{grid-column:1/6;margin-top:var(--s6)}
.figs{grid-column:10/13;grid-row:2/4;align-self:end;margin:0;display:flex;flex-direction:column}
.figs div{border-top:var(--hair);padding:var(--s3) 0 var(--s4);display:flex;align-items:baseline;justify-content:space-between;gap:var(--s4)}
.figs dt{font:700 calc(40*var(--px))/1 var(--display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.figs dd{margin:0;font-size:var(--small);color:var(--mute);text-align:right}

/* controls */
.ctl{grid-column:1/-1}
.row-k{display:flex;align-items:stretch;border-top:.5px solid var(--hc2)}
.row-k>.k{flex:none;width:calc(192*var(--px));padding-top:calc(19*var(--px));font:600 calc(11*var(--px))/1 var(--text);letter-spacing:.04em;text-transform:uppercase;color:var(--dim);display:flex;gap:var(--s2);align-items:flex-start}
.tabs{display:flex;gap:var(--s6);overflow-x:auto;scrollbar-width:none;flex:1}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;flex:none;display:flex;align-items:center;gap:var(--s2);border:0;background:none;padding:var(--s4) 0;font:600 calc(14*var(--px))/1 var(--text);color:var(--dim);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--mute)}
.tab[aria-selected="true"]{color:var(--paper)}
.tab[aria-selected="true"]:after{content:"";position:absolute;left:0;right:0;top:-1px;height:2px;background:var(--paper)}
.tab:focus-visible,.bar:focus-visible,.srt:focus-visible,.more:focus-visible{outline:1px solid var(--amber);outline-offset:2px}
.bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));flex:1}
.bar{position:relative;text-align:left;border:0;background:none;padding:var(--s4) var(--s6) 0 0;cursor:pointer;color:var(--dim)}
.bar b{display:block;font:600 var(--h3)/1 var(--display);letter-spacing:-.015em}
.bar span{display:block;margin-top:var(--s2);font-size:var(--small);font-weight:500}
.bar i{display:block;margin-top:var(--s2);font-style:normal;font-size:var(--small);color:var(--dim);opacity:.8;line-height:1.45}
.bar:hover{color:var(--mute)}
.bar[aria-pressed="true"]{color:var(--paper)}
.bar[aria-pressed="true"]:after{content:"";position:absolute;left:0;right:var(--s6);top:-1px;height:2px;background:var(--paper)}
.bar[aria-pressed="true"] i{color:var(--mute)}

/* pick */
.pick{grid-column:1/-1;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gt)}
.pick .main{grid-column:1/7}
.pick .alt{padding-left:var(--s5);border-left:var(--hair)}
.pick .alt.a1{grid-column:7/10}.pick .alt.a2{grid-column:10/13}
.pk-l{font:600 calc(11*var(--px))/1 var(--text);letter-spacing:.04em;text-transform:uppercase;color:var(--dim)}
.main .pk-l{color:var(--paper)}
.pk-n{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s4);font:700 calc(24*var(--px))/1 var(--display);letter-spacing:-.03em}
.main .pk-n{font-size:calc(56*var(--px));letter-spacing:-.045em;gap:var(--s4)}
.pk-n .blogo{width:calc(20*var(--px));height:calc(20*var(--px))}
.main .pk-n .blogo{width:calc(36*var(--px));height:calc(36*var(--px))}
.pk-s{margin-top:var(--s3);font-size:calc(13*var(--px));font-weight:500;color:var(--mute)}
.main .pk-s{font-size:calc(16*var(--px))}
.pk-v{display:flex;flex-wrap:wrap;gap:var(--s5);margin-top:var(--s5)}
.main .pk-v{gap:var(--s8);margin-top:var(--s7)}
.pk-v div b{display:block;font:700 calc(20*var(--px))/1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.main .pk-v div b{font-size:calc(40*var(--px));letter-spacing:-.045em}
.pk-v div span{display:flex;gap:calc(5*var(--px));align-items:center;margin-top:var(--s2);font-size:var(--small);color:var(--mute)}
.note{grid-column:1/-1;margin-top:var(--s7);font-size:calc(14*var(--px));font-weight:500;color:var(--mute);max-width:80ch}
.warn{grid-column:1/-1;padding:var(--s4) 0;border-top:1px solid var(--amber);color:var(--paper);font-size:calc(15*var(--px));font-weight:500}
.warn b{color:var(--amber)}

/* three-dimension chart */
.dim{grid-column:1/-1}
.dm-h,.dm-r{display:grid;grid-template-columns:3fr 3fr 3fr 3fr;column-gap:var(--gt);align-items:center}
.dm-h{padding-bottom:var(--s3);border-bottom:var(--hair)}
.dm-h>div:first-child{font:600 calc(11*var(--px))/1 var(--text);letter-spacing:.04em;color:var(--dim);align-self:start}
.dm-h .t{display:flex;align-items:center;gap:var(--s2);font-weight:600;font-size:calc(14*var(--px))}
.dm-h .d{margin-top:var(--s1);font-size:calc(11*var(--px));color:var(--dim)}
.axis{position:relative;height:calc(14*var(--px));margin-top:var(--s2);margin-right:calc(92*var(--px));font-size:calc(10*var(--px));color:var(--dim)}
.axis span{position:absolute;top:0;white-space:nowrap}
.dm-r{min-height:calc(44*var(--px));border-bottom:.5px solid var(--faint)}
.dm-r.off{opacity:.5}
.dm-m{display:flex;align-items:center;gap:var(--s3);min-width:0;font-weight:600;font-size:calc(14*var(--px))}
.dm-m .blogo{width:calc(18*var(--px));height:calc(18*var(--px))}
.dm-m small{font-size:calc(11*var(--px));font-weight:500;color:var(--dim);white-space:nowrap}
.dm-m .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{flex:none;font:600 calc(10*var(--px))/1 var(--text);letter-spacing:.04em;text-transform:uppercase;padding:calc(3*var(--px)) calc(5*var(--px));box-shadow:inset 0 0 0 .5px var(--hc2);color:var(--paper)}
.cell{display:flex;align-items:center;gap:var(--s4);padding-left:0}
.cell .ic{display:none}
.trk{position:relative;flex:1;height:calc(8*var(--px));background:var(--faint)}
.trk i{position:absolute;left:0;top:0;bottom:0;background:var(--paper)}
.trk u{position:absolute;top:calc(-4*var(--px));bottom:calc(-4*var(--px));width:1px;background:var(--mute)}
.cell b{flex:none;width:calc(76*var(--px));text-align:right;font-size:calc(13*var(--px));font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.dm-f{display:flex;flex-wrap:wrap;gap:var(--s4);align-items:baseline;margin-top:var(--s4);font-size:var(--small);color:var(--mute)}
.more{border:0;background:none;padding:0;font:600 calc(13*var(--px))/1 var(--text);color:var(--paper);cursor:pointer}

/* table */
.tbl{grid-column:1/-1}
.srt{display:inline-flex;align-items:center;gap:calc(5*var(--px));border:0;background:none;padding:var(--s1) 0;font:600 calc(13*var(--px))/1 var(--text);color:var(--dim);cursor:pointer;border-bottom:1.5px solid transparent}
.srt[aria-pressed="true"]{color:var(--paper);border-bottom-color:var(--paper)}
.tr{display:grid;grid-template-columns:calc(48*var(--px)) 3fr 4fr 3fr 1.4fr 1.6fr;column-gap:var(--gt);align-items:center;min-height:calc(60*var(--px));border-bottom:var(--hair)}
.tr.h{min-height:calc(36*var(--px));font-size:calc(11*var(--px));font-weight:600;letter-spacing:.04em;color:var(--dim)}
.tr.h>span{display:flex;align-items:center;gap:calc(5*var(--px))}
.tr.h>span:last-child{justify-content:flex-end}
.tr.off{opacity:.45}
.tr .rn{font-family:var(--mono);font-size:var(--small);color:var(--mute)}
.tr .su{font-size:calc(13*var(--px));font-weight:500;color:var(--mute)}
.tr .ps{display:flex;align-items:center;gap:var(--s4)}
.tr .ps .trk{height:calc(4*var(--px))}
.tr .ps b,.tr .co{font-weight:600;font-variant-numeric:tabular-nums}
.tr .ps b{width:calc(40*var(--px))}
.tr .tm{text-align:right;font-size:calc(13*var(--px));font-weight:500;color:var(--mute);font-variant-numeric:tabular-nums}
.tr .v3{display:none}
.sub{margin-top:var(--s9)}
.tail{display:flex;gap:var(--s4);padding-top:var(--s4);font-size:calc(13*var(--px));color:var(--mute)}

/* scatter */
.sc{grid-column:1/9}
.sc svg{display:block;width:100%;height:auto;overflow:visible}
.sc text{fill:var(--dim);font:calc(11*var(--px)) var(--text)}
.sc .lb{fill:var(--paper);font-weight:600}
.sc-t{grid-column:10/13;display:flex;flex-direction:column;gap:var(--s4)}
.sc-t p:first-child{font-size:var(--lede);font-weight:500;line-height:1.4}
.sc-t p{font-size:calc(14*var(--px));color:var(--mute)}

/* how, honest */
.steps{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:var(--gt)}
.steps div{padding-right:var(--s5)}
.steps div+div{padding-left:var(--s5);border-left:var(--hair)}
.steps b{display:block;font:700 calc(40*var(--px))/1 var(--display);letter-spacing:-.045em}
.steps h3{margin:var(--s4) 0 var(--s3);font:600 var(--h3)/1.2 var(--display);letter-spacing:-.015em}
.steps p{font-size:calc(14*var(--px));color:var(--mute)}
.hon{grid-column:5/-1}
.hon .n{display:grid;grid-template-columns:2fr 5fr;column-gap:var(--gt);padding:var(--s4) 0;border-bottom:var(--hair)}
.hon .n b{font-weight:600}
.hon .n p{color:var(--mute)}
.srcs{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s5);font-size:var(--small);color:var(--mute)}
.srcs span.st{color:var(--amber)}
.lnk{display:flex;flex-wrap:wrap;gap:var(--s6);padding-top:var(--s5);font-weight:600;font-size:calc(13*var(--px))}
.lnk a:hover{text-decoration:underline;text-underline-offset:.2em}
.hon-l{grid-column:1/5;font-weight:600;font-size:var(--small)}
.load{grid-column:1/-1;padding:var(--s9) 0;color:var(--mute)}

/* tablets upright, phones */
@media (max-width:1080px){
  #top h1{grid-column:1/-1}#top .lede{grid-column:1/-1}
  .figs{grid-column:1/-1;grid-row:auto;margin-top:var(--s7);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:var(--gt)}
  .pick .main{grid-column:1/-1}
  .pick .alt{grid-column:auto!important;margin-top:var(--s7);padding-left:0;border-left:0;border-top:var(--hair);padding-top:var(--s4)}
  .pick .alt.a1{grid-column:1/7!important}.pick .alt.a2{grid-column:7/13!important}
  .sc{grid-column:1/-1}.sc-t{grid-column:1/-1;margin-top:var(--s6)}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:var(--s7)}
  .steps div+div{padding-left:0;border-left:0}
  .hon,.hon-l{grid-column:1/-1}.hon-l{margin-bottom:var(--s4)}
}
@media (max-width:699px){
  .row-k{flex-direction:column}
  .row-k>.k{width:auto;padding:var(--s4) 0 var(--s2)}
  .bars{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bar{padding-bottom:var(--s4)}
  .bar i{display:none}
  .main .pk-n{font-size:calc(36*var(--px))}
  .main .pk-v{gap:var(--s5)}
  .main .pk-v div b{font-size:calc(28*var(--px))}
  .pick .alt.a1,.pick .alt.a2{grid-column:1/-1!important}
  .dm-h{display:none}
  .dm-r{grid-template-columns:1fr;row-gap:var(--s2);padding:var(--s4) 0}
  .cell .ic{display:inline-block;opacity:.66}
  .tr.h{display:none}
  .tr{grid-template-columns:calc(28*var(--px)) 1fr;row-gap:var(--s2);padding:var(--s4) 0;align-items:start}
  .tr>.mn{grid-column:2}
  .tr>.su{grid-column:2}
  .tr>.ps,.tr>.co,.tr>.tm{display:none}
  .tr .v3{display:flex;grid-column:2;gap:var(--s5);font-size:calc(13*var(--px));font-weight:600}
  .tr .v3 span{display:flex;gap:calc(5*var(--px));align-items:center}
  .sc,.sc-t{display:none}
  #s-scatter{display:none}
  .steps{grid-template-columns:1fr}
  .hon .n{grid-template-columns:1fr;row-gap:var(--s1)}
  .figs dt{font-size:calc(32*var(--px))}
}

</style>

 showAll:"顯示全部 {n} 個",showLess:"收起",

 shortT:"達不到「{t}」",shortS:"每個模型單獨完成、用它最合適的思考強度",setup:"配法",abC:"能力 · 過線率",prC:"價格 · 每件",spC:"速度 · 耗時",

 eff:{none:"不思考",minimal:"最低強度",low:"低強度",medium:"中強度",high:"高強度",xhigh:"超高強度",max:"最大強度",default:"預設強度"},
 effS:{none:"不思考",minimal:"最低",low:"低",medium:"中",high:"高",xhigh:"超高",max:"最大",default:"預設"},
 scT:"花費與耗時",scS:"{c} ·「{t}」檔中能過線的配法",scA:"每個點是一個模型過線的最便宜配法。",
 scB:"連線上的配法，花費和耗時都沒有對手。MAT 從最左端選起；你在等結果時，它可以沿著這條線用錢換時間。",
 scX:"每件花費 →",scY:"更快 ↓",
 howT:"MAT 怎麼選",howS:"每一類工作都是同樣四步",

 honT:"誠實的數字",
 hon:[["過線率是估算。","來自公開評測——Arena、Artificial Analysis、Vals 和 Scale——換算到同一把尺上。MAT 內建的複核會為你 Mac 上的每件工作打分，你那份表會從中學習。"],["價格是官方定價。","取自各家官網，截至 {d}。OpenRouter 只用來交叉核對。"],["本週資料來源","{s}"]],
 notes:"備註",dl:"下載本週資料（JSON）",arch:"歷來所有表",method:"怎麼算的",
 attr:"Arena 排行資料 © LMArena，CC BY 4.0。",stale:"沿用 {d} 讀到的資料",fail:"沒讀到",
 loading:"正在讀取本週的表…",err:"本週的表沒能讀出來，過一分鐘再試。",
 foot:["一個對話，用上你已付費的所有模型——在你自己的電腦上執行。","產品","測試版","公司"],min:"分",sec:"秒",langNote:"本頁目前提供英文、简体中文和繁體中文。"}
}[L];
const f=(s,o)=>s.replace(/\{(\w+)\}/g,(_,k)=>o[k]!=null?o[k]:'');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ic=(id,s)=>`<svg class="ic${s?' s':''}" aria-hidden="true"><use href="#ic-${id}"/></svg>`;
const MK={"Anthropic":"anthropic","OpenAI":"openai","Google":"google","SpaceXAI":"spacexai","Meta":"meta","Mistral":"mistral","DeepSeek":"deepseek","Alibaba":"alibaba","Z.ai":"zai","Moonshot":"moonshot","MiniMax":"minimax","ByteDance":"bytedance","Xiaomi":"xiaomi","Microsoft":"microsoft","Black Forest Labs":"bfl"};
const logo=mk=>MK[mk]?`<svg class="blogo" aria-hidden="true"><use href="#lg-${MK[mk]}"/></svg>`:`<svg class="blogo" aria-hidden="true" viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" fill="none" stroke="currentColor"/></svg>`;
const money=c=>c==null?'—':c===0?'$0':c<0.01?'$'+c.toFixed(3):c<1?'$'+c.toFixed(2):'$'+c.toFixed(2);
const pct=p=>Math.round(p*100)+'%';
const dur=s=>{ s=Math.round(s); if(s<60) return s+(L==='en'?' s':T.sec); const m=Math.floor(s/60), r=s%60; return L==='en'?`${m} min${r?' '+r+' s':''}`:`${m}${T.min}${r?' '+r+T.sec:''}`; };
const capTxt=s=>s<120?dur(s):(L==='en'?`${s/60} min`:`${s/60} ${T.min}`);
const CATS=["agents","search","reasoning","writing","factuality","coding","instructionFollowing","vision","imageGeneration"];
const TIERS=["draft","usable","deliver","critical"];

// ── static bits in the shell
document.title=(L==='en'?'Rankings · MAT':'排行榜 · MAT');
$('#navLinks').innerHTML=["problem","race","work","ranks","faq"].map((h,i)=>`<a href="../#${h}"${h==='ranks'?' class="cur"':''}>${T.nav[i]}</a>`).join('');
$('#navBeta .bl').textContent=T.beta;
$('#langC').textContent=LANGS.find(l=>l[0]===L)[1].slice(0,L==='en'?2:2).replace('En','EN');
$('#langBtn').addEventListener('click',e=>{ const p=$('#langPop'); const open=p.hidden; p.hidden=!open; e.currentTarget.setAttribute('aria-expanded',open); });
$('#langPop').innerHTML=LANGS.map(([c,n])=>`<button type="button" data-l="${c}"${c===L?' aria-current="true"':''}>${n}</button>`).join('')+`<p>${T.langNote}</p>`;
$('#langPop').addEventListener('click',e=>{ const b=e.target.closest('[data-l]'); if(!b) return; try{ localStorage.setItem('mat-lang',b.dataset.l); }catch(x){} const u=new URL(location.href); u.searchParams.set('lang',b.dataset.l); location.href=u.toString(); });
document.addEventListener('click',e=>{ if(!e.target.closest('#langPop,#langBtn')) $('#langPop').hidden=true; });
$('#footLine').textContent=T.foot[0]; $('#fh1').textContent=T.foot[1]; $('#fh2').textContent=T.foot[2]; $('#fh3').textContent=T.foot[3];
$('#app').innerHTML=`<div class="g"><p class="load">${T.loading}</p></div>`;

// ── state
const st={cat:'coding',tier:'deliver',sort:'price',allDim:false,allShort:false};
const h=/^#(\w+)\/(\w+)/.exec(location.hash); if(h&&CATS.includes(h[1])&&TIERS.includes(h[2])){ st.cat=h[1]; st.tier=h[2]; }
let D,N;

fetch('v2/latest.json',{cache:'no-cache'}).then(r=>{ if(!r.ok) throw 0; return r.json(); }).then(d=>{ D=d; N=Object.fromEntries(d.models.map(m=>[m.id,m])); draw(); })
 .catch(()=>{ $('#app').innerHTML=`<div class="g"><p class="load">${T.err}</p></div>`; });

function single(row,tier,cap){ // a model on its own at the effort that gives the best pass chance inside the limit
  if(row.variants){ const vs=row.variants.filter(v=>v.t<=cap); if(!vs.length) return null;
    const v=vs.reduce((a,b)=>(b.p[tier]>a.p[tier]||(b.p[tier]===a.p[tier]&&b.c<a.c))?b:a); return {m:row.m,effort:v.effort,P:v.p[tier],cost:v.c,time:v.t}; }
  return row.c==null?null:{m:row.m,P:row.p[tier],cost:row.c,time:row.t||20,k:1};
}
function setupTxt(o,short){
  if(o.k!=null) return o.k>1?f(T.drawK,{k:o.k}):T.draw1;
  const e=short?T.effS[o.effort]||o.effort:T.eff[o.effort]||o.effort;
  return e+' · '+(o.reviewer?f(T.checks,{m:N[o.reviewer].name}):T.alone);
}

function draw(){
  const B=D.boards.find(b=>b.category===st.cat), TI=D.tiers.find(t=>t.id===st.tier), PK=B.picks[st.tier];
  const catName=T.cats[st.cat], tierName=T.tiers[st.tier][0];
  const rows=B.rows.filter(r=>!(N[r.m]||{}).local);
  const singles=rows.map(r=>single(r,st.tier,TI.cap)).filter(Boolean).sort((a,b)=>b.P-a.P||a.cost-b.cost);
  const clears=(PK.cheapest||[]).slice();
  const clearIds=new Set(clears.map(o=>o.m));
  const out=[];

  // header
  out.push(`<section id="top"><div class="g">
    <p class="lab"><a href="../#ranks">←<span>${T.back}</span></a><em>${f(T.rebuilt,{d:D.fetched})}</em></p>
    <h1>${T.h1}</h1><p class="lede">${T.lede}</p>
    <dl class="figs"><div><dt>${D.models.length}</dt><dd>${T.figs[0][0]}</dd></div><div><dt>9</dt><dd>${T.figs[1][0]}</dd></div><div><dt>4</dt><dd>${T.figs[2][0]}</dd></div><div><dt>$0</dt><dd>${T.figs[3][0]}</dd></div></dl>
  </div></section>`);

  // controls
  out.push(`<section id="s-ctl" style="padding-bottom:var(--s9)"><div class="g"><div class="ctl">
    <div class="row-k"><span class="k">${T.kind}</span><div class="tabs" role="tablist" aria-label="${T.kind}">${CATS.map(c=>`<button class="tab" role="tab" data-c="${c}" aria-selected="${c===st.cat}">${ic(c)}<span>${T.cats[c]}</span></button>`).join('')}</div></div>
    <div class="row-k"><span class="k">${ic('ability',1)}${T.bar}</span><div class="bars">${D.tiers.map(t=>`<button class="bar" data-t="${t.id}" aria-pressed="${t.id===st.tier}"><b>${T.tiers[t.id][0]}</b><span>${f(T.barline,{p:Math.round(t.bar*100),t:capTxt(t.cap)})}</span><i>${T.tiers[t.id][1]}</i></button>`).join('')}</div></div>
  </div></div></section>`);

  // pick
  const lab=(a,b,r='')=>`<p class="sec-lab"><b>${a}</b><span>${b}</span>${r?`<span class="r">${r}</span>`:''}</p>`;
  const main=clears[0], runner=clears[1], fast=PK.fastest;
  let pk=`<section id="s-pick"><div class="g">${lab(catName+' · '+tierName, PK.feasible?f(T.clearN,{n:PK.feasible}):T.none)}`;
  const stats=(o,big)=>`<div class="pk-v"><div><b>${pct(o.P)}</b><span>${ic('ability',1)}${big?T.pass:T.passS}</span></div><div><b>${money(o.cost)}</b><span>${ic('price',1)}${big?T.perjob:T.jobS}</span></div><div><b>${dur(o.time)}</b><span>${ic('speed',1)}${big?T.time:T.timeS}</span></div></div>`;
  const card=(cls,l,o,big)=>`<div class="${cls}"><p class="pk-l">${l}</p><p class="pk-n">${logo(N[o.m].maker)}<span>${esc(N[o.m].name)}</span></p><p class="pk-s">${setupTxt(o)}</p>${stats(o,big)}</div>`;
  if(main){
    const same=(a,b)=>a&&b&&a.m===b.m&&a.effort===b.effort&&a.reviewer===b.reviewer&&a.k===b.k;
    let alts='';
    if(same(fast,main)) alts=(runner?card('alt a1',T.runner,runner):'')+`<div class="alt a2"><p class="pk-l">${T.fastest}</p><p class="pk-s">${T.same}</p></div>`;
    else if(same(fast,runner)) alts=card('alt a1',T.runner+' · '+T.fastest,runner);
    else alts=(runner?card('alt a1',T.runner,runner):'')+(fast?card('alt a2',T.fastest,fast):'');
    pk+=`<div class="pick">${card('main',T.pick,main,true)}${alts}</div>`;
    const top=singles[0];
    if(top&&top.m!==main.m){ const theirs=clears.find(o=>o.m===top.m); if(theirs&&theirs.cost>main.cost*1.05) pk+=`<p class="note">${f(T.why,{a:esc(N[top.m].name),b:esc(N[main.m].name),t:tierName,x:Math.round((1-main.cost/theirs.cost)*100)})}</p>`; }
  } else if(PK.bestEffort){
    const b=PK.bestEffort; pk+=`<p class="warn"><b>${T.none}</b> ${f(T.noneBody,{p:Math.round(b.P*100)})}</p><div class="pick">${card('main',T.pick,b,true)}</div>`;
  }
  out.push(pk+`</div></section>`);

  // ability · price · speed
  const lp=c=>Math.max(0.02,Math.min(1,(Math.log10(Math.max(c,0.001))+2)/2));
  const showN=st.allDim?singles.length:Math.min(12,singles.length);
  let dm=`<section id="s-dim"><div class="g">${lab(T.dimT,f(T.dimS,{c:catName,t:tierName,cap:capTxt(TI.cap)}))}<div class="dim">
    <div class="dm-h"><div>${T.model}</div>
      <div><div class="t">${ic('ability')}${T.ab}</div><div class="d">${T.abD}</div><div class="axis"><span style="left:0">0%</span><span style="left:${TI.bar*100}%;transform:translateX(-100%);padding-right:4px">${tierName} ${Math.round(TI.bar*100)}%</span></div></div>
      <div><div class="t">${ic('price')}${T.pr}</div><div class="d">${T.prD}</div><div class="axis"><span style="left:0">$0.01</span><span style="left:50%;transform:translateX(-50%)">$0.10</span><span style="right:0">$1</span></div></div>
      <div><div class="t">${ic('speed')}${T.sp}</div><div class="d">${T.spD}</div><div class="axis"><span style="left:0">0</span><span style="right:0">${capTxt(TI.cap)}</span></div></div></div>`;
  singles.slice(0,showN).forEach(o=>{ const m=N[o.m], on=o.P>=TI.bar, isPick=main&&main.m===o.m;
    dm+=`<div class="dm-r${on?'':' off'}"><div class="dm-m">${logo(m.maker)}<span class="nm">${esc(m.name)}</span><small>${o.effort?T.effS[o.effort]||o.effort:''}</small>${isPick?`<span class="tag">${T.pick}</span>`:''}</div>
      <div class="cell">${ic('ability',1)}<span class="trk"><i style="width:${o.P*100}%"></i><u style="left:${TI.bar*100}%"></u></span><b>${pct(o.P)}</b></div>
      <div class="cell">${ic('price',1)}<span class="trk"><i style="width:${lp(o.cost)*100}%"></i></span><b>${money(o.cost)}</b></div>
      <div class="cell">${ic('speed',1)}<span class="trk"><i style="width:${Math.min(100,o.time/TI.cap*100)}%"></i><u style="left:calc(100% - 1px)"></u></span><b>${dur(o.time)}</b></div></div>`; });
  dm+=`<div class="dm-f"><span>${f(T.dimF,{t:tierName})}</span>${singles.length>12?`<button class="more" data-more="dim">${st.allDim?T.showLess:f(T.showAll,{n:singles.length})}</button>`:''}</div></div></div></section>`;
  out.push(dm);

  // the setups that clear, and the ones that don't
  const sorted=clears.slice().sort(st.sort==='price'?(a,b)=>a.cost-b.cost||a.time-b.time:(a,b)=>a.time-b.time||a.cost-b.cost);
  const hdr=`<div class="tr h"><span>#</span><span>${T.model}</span><span>${T.setup}</span><span>${ic('ability',1)}${T.abC}</span><span>${ic('price',1)}${T.prC}</span><span>${ic('speed',1)}${T.spC}</span></div>`;
  const line=(o,i,off)=>{ const m=N[o.m]; return `<div class="tr${off?' off':''}"><span class="rn">${String(i+1).padStart(2,'0')}</span><span class="mn dm-m">${logo(m.maker)}<span class="nm">${esc(m.name)}</span><small>${esc(m.maker)}</small></span>
    <span class="su">${off?f(T.best,{e:o.effort?(T.eff[o.effort]||o.effort):T.draw1}):setupTxt(o)}</span>
    <span class="ps"><span class="trk"><i style="width:${o.P*100}%"></i><u style="left:${TI.bar*100}%"></u></span><b>${pct(o.P)}</b></span><span class="co">${off?'—':money(o.cost)}</span><span class="tm">${off?'—':dur(o.time)}</span>
    <span class="v3"><span>${ic('ability',1)}${pct(o.P)}</span>${off?'':`<span>${ic('price',1)}${money(o.cost)}</span><span>${ic('speed',1)}${dur(o.time)}</span>`}</span></div>`; };
  const shorts=singles.filter(o=>!clearIds.has(o.m));
  const showS=st.allShort?shorts.length:Math.min(5,shorts.length);
  let tb=`<section id="s-tbl"><div class="g"><div class="tbl">`;
  if(sorted.length){
    tb+=`<p class="sec-lab"><b>${f(T.clears,{t:tierName})}</b><span>${f(T.clearsS,{n:sorted.length})}</span><span class="r"><span>${T.sortBy}</span><button class="srt" data-s="price" aria-pressed="${st.sort==='price'}">${ic('price',1)}${T.pr}</button><button class="srt" data-s="speed" aria-pressed="${st.sort==='speed'}">${ic('speed',1)}${T.sp}</button></span></p>`+hdr+sorted.map((o,i)=>line(o,i)).join('');
  }
  if(shorts.length){
    tb+=`<div class="${sorted.length?'sub':''}"><p class="sec-lab"><b>${f(T.shortT,{t:tierName})}</b><span>${T.shortS}</span></p>${hdr}${shorts.slice(0,showS).map((o,i)=>line(o,sorted.length+i,true)).join('')}
      ${shorts.length>5?`<p class="tail"><button class="more" data-more="short">${st.allShort?T.showLess:f(T.showAll,{n:shorts.length})}</button></p>`:''}</div>`;
  }
  out.push(tb+`</div></div></section>`);

  // cost and time
  const pts=[...clears,...(PK.frontier||[])].filter((o,i,a)=>a.findIndex(x=>x.m===o.m&&x.effort===o.effort&&x.reviewer===o.reviewer&&x.k===o.k)===i);
  if(pts.length>=2){
    const W=880,H=360,Lm=64,Bm=44, cs=pts.map(o=>o.cost), ts=pts.map(o=>o.time);
    const x0=Math.log10(Math.min(...cs)/1.3), x1=Math.log10(Math.max(...cs)*1.3), y1=TI.cap, y0=Math.max(0,Math.floor((Math.min(...ts)-10)/30)*30);
    const X=c=>Lm+(Math.log10(c)-x0)/(x1-x0)*(W-Lm), Y=s=>H-(s-y0)/(y1-y0)*H;
    let g=`<svg viewBox="-4 -16 ${W+8} ${H+Bm+16}" role="img" aria-label="${T.scT}">`;
    for(let k=0;k<=4;k++){ const s=y0+(y1-y0)*k/4; g+=`<line x1="${Lm}" x2="${W}" y1="${Y(s)}" y2="${Y(s)}" stroke="currentColor" stroke-opacity="${k?0.08:0.3}"/><text x="0" y="${Y(s)+4}">${dur(s)}</text>`; }
    const ticks=[0.005,0.01,0.02,0.05,0.1,0.2,0.5,1,2,5].filter(c=>Math.log10(c)>=x0&&Math.log10(c)<=x1);
    ticks.forEach(c=>{ g+=`<line x1="${X(c)}" x2="${X(c)}" y1="${H}" y2="${H+6}" stroke="currentColor" stroke-opacity=".3"/><text x="${X(c)}" y="${H+22}" text-anchor="middle">${money(c)}</text>`; });
    g+=`<text x="${W}" y="${H+40}" text-anchor="end">${T.scX}</text><text x="0" y="${H+40}">${T.scY}</text>`;
    pts.forEach(o=>{ g+=`<circle cx="${X(o.cost)}" cy="${Y(o.time)}" r="4" fill="currentColor" fill-opacity=".35"><title>${esc(N[o.m].name)} · ${setupTxt(o,1)} · ${pct(o.P)} · ${money(o.cost)} · ${dur(o.time)}</title></circle>`; });
    const fr=(PK.frontier||[]); if(fr.length>1) g+=`<polyline points="${fr.map(o=>X(o.cost)+','+Y(o.time)).join(' ')}" fill="none" stroke="currentColor" stroke-width="1.5"/>`;
    fr.forEach(o=>{ g+=`<circle cx="${X(o.cost)}" cy="${Y(o.time)}" r="5" fill="currentColor"/>`; });
    if(main){ g+=`<circle cx="${X(main.cost)}" cy="${Y(main.time)}" r="11" fill="none" stroke="currentColor" stroke-width="1.5"/><text class="lb" x="${X(main.cost)-6}" y="${Y(main.time)-18}">${T.pick} · ${money(main.cost)} · ${dur(main.time)}</text>`; }
    g+=`</svg>`;
    out.push(`<section id="s-scatter"><div class="g">${lab(T.scT,f(T.scS,{c:catName,t:tierName}))}<div class="sc">${g}</div><div class="sc-t"><p>${T.scA}</p><p>${T.scB}</p></div></div></section>`);
  }

  // how, honest numbers
  out.push(`<section id="s-how"><div class="g">${lab(T.howT,T.howS)}<div class="steps">${T.steps.map((s,i)=>`<div><b>0${i+1}</b><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join('')}</div></div></section>`);
  const SL={aa:"Artificial Analysis",arena_overall:"Arena Text",arena_coding:"Arena Coding",arena_math:"Arena Math",arena_creative_writing:"Arena Creative Writing",arena_chinese:"Arena Chinese",arena_instruction_following:"Arena Instruction Following",arena_vision:"Arena Vision",arena_document:"Arena Document",arena_search:"Arena Search",arena_webdev:"Arena WebDev",arena_text_to_image:"Arena Text-to-Image",arena_image_edit:"Arena Image Edit",arena_agent:"Arena Agent",vals_terminal_bench_4:"Terminal-Bench 4.0",vals_terminal_bench_2_1:"Terminal-Bench 2.1",vals_swebench:"SWE-bench Verified",vals_index:"Vals Index",vals_proofbench:"ProofBench",vals_mmmu:"MMMU-Pro",scale_hle_diamond:"HLE-Diamond",eqbench_creative_writing:"EQ-Bench Creative Writing",openrouter:"OpenRouter prices"};
  const srcs=Object.entries(D.sources||{}).filter(([k])=>SL[k]).map(([k,s])=>`<span>${SL[k]}${s.updated?' · '+s.updated:''}${s.ok?'':` <span class="st">(${s.staleSince?f(T.stale,{d:s.staleSince}):T.fail})</span>`}</span>`).join('');
  out.push(`<section id="s-hon"><div class="g"><p class="sec-lab" style="grid-column:1/-1"></p><p class="hon-l">${T.honT}</p><div class="hon">
    ${T.hon.map(([a,b],i)=>`<div class="n"><b>${a}</b>${i===2?`<div class="srcs">${srcs}</div>`:`<p>${f(b,{d:D.fetched})}</p>`}</div>`).join('')}
    <div class="n"><b>Arena</b><p>${T.attr} <a class="u" href="https://huggingface.co/datasets/lmarena-ai/leaderboard-dataset" target="_blank" rel="noopener">lmarena-ai/leaderboard-dataset</a></p></div>
    <div class="lnk"><a href="v2/latest.json" download>${T.dl} →</a><a href="v2/index.json">${T.arch} →</a><a href="https://github.com/RobertLeeHao/MAT/tree/main/rankings" target="_blank" rel="noopener">${T.method} ↗</a></div>
  </div></div></section>`);

  $('#app').innerHTML=out.join('');
  const tabs=$('.tabs'), cur=tabs.querySelector('[aria-selected="true"]'); if(cur&&tabs.scrollWidth>tabs.clientWidth) tabs.scrollLeft=cur.offsetLeft-tabs.clientWidth/2+cur.offsetWidth/2;
}

document.addEventListener('click',e=>{
  const t=e.target.closest('.tab'), b=e.target.closest('.bar'), s=e.target.closest('.srt'), m=e.target.closest('.more');
  if(!D) return;
  if(t){ st.cat=t.dataset.c; st.allDim=st.allShort=false; }
  else if(b){ st.tier=b.dataset.t; st.allDim=st.allShort=false; }
  else if(s){ st.sort=s.dataset.s; }
  else if(m){ if(m.dataset.more==='dim') st.allDim=!st.allDim; else st.allShort=!st.allShort; }
  else return;
  history.replaceState(null,'','#'+st.cat+'/'+st.tier);
  const y=window.scrollY; draw(); window.scrollTo(0,y);
});
document.addEventListener('keydown',e=>{ const t=e.target.closest&&e.target.closest('.tab'); if(!t||!/Arrow(Left|Right)/.test(e.key)) return;
  const i=CATS.indexOf(st.cat)+(e.key==='ArrowRight'?1:-1); st.cat=CATS[(i+CATS.length)%CATS.length]; draw(); $('.tab[aria-selected="true"]').focus(); });
})();

</script>
