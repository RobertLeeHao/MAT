name: Rankings

# Every Monday 09:17 Beijing time, rebuild MAT's model rankings from public sources,
# check them, and publish rankings/v2/latest.json with the website.
on:
  schedule:
    - cron: "17 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: rankings
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r rankings/pipeline/requirements.txt
      - id: run
        run: sh rankings/pipeline/run.sh
      - name: Summary
        if: always()
        run: cat rankings/v2/changes/$(date -u +%F).md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Commit
        if: always()
        run: |
          git config user.name "MAT rankings bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rankings/data rankings/v2 rankings/local
          git diff --cached --quiet && exit 0
          git commit -m "Rankings $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish with the website
        if: steps.run.outputs.published == 'true' || steps.run.outputs.local == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run Website -R "$GITHUB_REPOSITORY"
