name: Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Only the page and its public images go out
        run: |
          mkdir _site && cp -r index.html og.png favicon.svg favicon-32.png apple-touch-icon.png media _site/
          # the weekly model rankings, read by the app and the website
          if [ -d rankings/v2 ]; then mkdir -p _site/rankings && cp -r rankings/v2 rankings/index.html _site/rankings/; fi
          # the weekly table of models that run on a Mac (Ollama), read by the app
          if [ -d rankings/local ]; then mkdir -p _site/rankings && cp -r rankings/local _site/rankings/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
